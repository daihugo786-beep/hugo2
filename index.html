*{box-sizing:border-box;}
body{

header{

}
header h1{ margin:0 0 4px; font-size:20px; letter-spacing:0.02em; }
header p{ margin:0; color:var(--text-dim); font-size:13px; line-height:1.6; }
.wrap{ max-width:900px; margin:0 auto; width:100%; padding:0 16px; flex:1; display:flex; flex-direction:column; }
header .wrap{ padding:0; }

.fields-hint{ margin:14px 0 0; font-size:12px; color:var(--text-dim); display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.fields-hint .tag{
  background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:2px 8px;

}
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
.chip{
  background:var(--chip); border:1px solid var(--chip-border); color:var(--text);

  transition:background .15s;
}
.chip:hover{ background:var(--accent-soft); }

#log{ flex:1; overflow-y:auto; padding:18px 0 8px; display:flex; flex-direction:column; gap:16px; }
.msg{ display:flex; flex-direction:column; max-width:100%; }
.msg.user{ align-items:flex-end; }
.msg.ai{ align-items:flex-start; }
.bubble{
  border-radius:14px; padding:11px 14px; font-size:14.5px; line-height:1.65; white-space:pre-wrap;
  max-width:92%;
}
.msg.user .bubble{ background:var(--bubble-user); color:var(--bubble-user-text); border-bottom-right-radius:4px; }
.msg.ai .bubble{ background:var(--bubble-ai); color:var(--bubble-ai-text); border-bottom-left-radius:4px; width:100%; }

.card{
  background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px;
  margin-top:8px; box-shadow:var(--shadow); width:100%;
}
.card canvas{ max-height:340px; }
.caveats{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
.caveats div{ font-size:12px; color:var(--text-dim); margin-top:4px; display:flex; gap:6px; }
.caveats div::before{ content:"⚠"; color:var(--accent2); flex-shrink:0; }

.thinking{ color:var(--text-dim); font-size:13px; font-style:italic; }

.inputbar{
  border-top:1px solid var(--border); background:var(--panel); padding:12px 0 18px;
  position:sticky; bottom:0;
}
.inputrow{ display:flex; gap:8px; }
#q{
  flex:1; border:1px solid var(--border); border-radius:10px; padding:11px 13px;
  font-size:14.5px; background:var(--bg); color:var(--text); resize:none; font-family:inherit;
}
#q:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
#send{
  background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 20px;
  font-size:14.5px; cursor:pointer; font-weight:600;
}
#send:disabled{ opacity:.5; cursor:default; }
.hint{ font-size:11.5px; color:var(--text-dim); margin-top:6px; }

details.notes{ margin:14px 0; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:2px 14px; }
details.notes summary{ cursor:pointer; padding:10px 0; font-size:13.5px; font-weight:600; color:var(--text); }
details.notes ul{ margin:0 0 12px; padding-left:18px; color:var(--text-dim); font-size:12.5px; line-height:1.8; }

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
</style>

<script>
const PAYLOAD = JSON.parse(document.getElementById('payload-data').textContent);
const DATA = PAYLOAD.data;
const COUNTIES = PAYLOAD.counties;
const SIX = PAYLOAD.six;
const NOTES = PAYLOAD.notes;
const PARTIES = PAYLOAD.parties;
const YEAR_MIN = PAYLOAD.yearMin;
const YEAR_MAX = PAYLOAD.yearMax;

const METRIC_LABEL = { total: "施政總分", poll: "民調分數", expert: "專家評分", rank: "總排名（數字越小越好）" };

// visible hint of what can be asked/filtered on
const fieldsHintEl = document.getElementById('fieldsHint');
fieldsHintEl.innerHTML = '可查詢欄位：' +
  ['總排名', '政黨', '總分', '民調'].map(f => `<span class="tag">${f}</span>`).join('');

// render methodology notes
const notesList = document.getElementById('notesList');
NOTES.forEach(n => {
  const li = document.createElement('li');
  li.textContent = n;
  notesList.appendChild(li);
});

// suggested chips
const SUGGESTIONS = [
  "台北市這十年的滿意度變化",
  "六都最新一年排名比較",
  "哪個縣市這五年進步最多",
  "新北市和桃園市這十年的比較",
  "民進黨執政的縣市最新總分排名"
];
const chipsEl = document.getElementById('chips');
SUGGESTIONS.forEach(s => {
  const c = document.createElement('div');
  c.className = 'chip';
  c.textContent = s;
  c.onclick = () => { document.getElementById('q').value = s; sendQuery(); };
  chipsEl.appendChild(c);
});

const log = document.getElementById('log');
const qEl = document.getElementById('q');
const sendBtn = document.getElementById('send');

function addUserMsg(text){
  const m = document.createElement('div');
  m.className = 'msg user';
  m.innerHTML = `<div class="bubble"></div>`;
  m.querySelector('.bubble').textContent = text;
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
}

function addAiThinking(){
  const m = document.createElement('div');
  m.className = 'msg ai';
  m.innerHTML = `<div class="bubble thinking">正在查詢資料庫…</div>`;
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m;
}

let chartCounter = 0;

function renderAiResult(container, {commentaryText, chartSpec, caveats, error}){
  container.className = 'msg ai';
  if (error){
    container.innerHTML = `<div class="bubble">${escapeHtml(error)}</div>`;
    return;
  }
  chartCounter++;
  const canvasId = 'chart_' + chartCounter;
  let caveatHtml = '';
  if (caveats && caveats.length){
    caveatHtml = `<div class="caveats">${caveats.map(c => `<div>${escapeHtml(c)}</div>`).join('')}</div>`;
  }
  container.innerHTML = `
    <div class="bubble">${escapeHtml(commentaryText)}
      <div class="card">
        <canvas id="${canvasId}"></canvas>
        <div id="${canvasId}_err" style="display:none;color:var(--danger);font-size:12.5px;padding:6px 0;"></div>
        ${caveatHtml}
      </div>
    </div>`;
  log.scrollTop = log.scrollHeight;

  // chart drawing is isolated: if it fails, the commentary text above stays intact
  // and we just show an inline error in the card instead of losing the whole message.
  try {
    if (window.__chartLoadFailed || typeof Chart === 'undefined'){
      throw new Error('圖表函式庫（Chart.js）載入失敗，可能是網路問題，請重新整理頁面再試一次。');
    }
    drawChart(canvasId, chartSpec);
  } catch (e){
    console.error('chart draw error', e, chartSpec);
    const errBox = document.getElementById(canvasId + '_err');
    if (errBox){
      errBox.style.display = 'block';
      errBox.textContent = '⚠ 圖表繪製失敗：' + (e && e.message ? e.message : String(e));
    }
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function normalizeCountyList(list){
  if (!Array.isArray(list)) return [];
  const out = [];
  for (let name of list){
    if (name === 'ALL'){ COUNTIES.forEach(c => { if(!out.includes(c)) out.push(c); }); continue; }
    if (name === 'SIX' || name === '六都'){ SIX.forEach(c => { if(!out.includes(c)) out.push(c); }); continue; }
    if (COUNTIES.includes(name) && !out.includes(name)) out.push(name);
  }
  return out;
}

function normalizePartyList(list){
  if (!Array.isArray(list)) return [];
  return list.filter(p => PARTIES.includes(p));
}

// ---- deterministic query engine over DATA ----
function runQuery(spec){
  const metric = ['total','poll','expert','rank'].includes(spec.metric) ? spec.metric : 'total';
  let yearStart = Number(spec.yearStart) || YEAR_MIN;
  let yearEnd = Number(spec.yearEnd) || YEAR_MAX;
  if (yearStart > yearEnd) [yearStart, yearEnd] = [yearEnd, yearStart];
  yearStart = Math.max(YEAR_MIN, yearStart);
  yearEnd = Math.min(YEAR_MAX, yearEnd);

  let counties = normalizeCountyList(spec.counties);
  const mode = ['trend','ranking','growth'].includes(spec.mode) ? spec.mode : 'trend';
  const partyFilter = normalizePartyList(spec.party);
  const DATA_ACTIVE = partyFilter.length ? DATA.filter(d => partyFilter.includes(d.party)) : DATA;

  const caveats = [];
  if (partyFilter.length){
    caveats.push(`已篩選為只顯示執政黨為「${partyFilter.join('、')}」的年份，若某縣市在區間內換過黨執政，非該黨執政的年份不會顯示，圖上可能出現斷點。`);
  }
  // crosses 2010 merger boundary
  if (yearStart < 2010 && yearEnd >= 2010){
    const mergedSelected = counties.filter(c => ['新北市','台中市','台南市','高雄市'].includes(c));
    if (mergedSelected.length){
      caveats.push('所選區間橫跨2010年縣市合併，圖表已將合併前後資料串接為同一條線，但合併前後統計基礎不完全相同，比較時請留意。');
    }
  }
  if (yearStart < 2010){
    caveats.push('2003–2009年僅有民調分數，2010年起才有「民調+專家」加權總分，跨這個時間點比較「總分」時基礎不同。');
  }
  if (yearStart < 2024 && yearEnd >= 2023){
    caveats.push('2023年起排名改為分組制（標竿組／優等組／佳等組／衝刺組），不再是連續名次，「總排名」在2023年前後的意義不完全相同。');
  }

  function getVal(row){ return row[metric]; }

  let resultTable = [];
  let chartData = null;

  if (mode === 'trend'){
    if (!counties.length) counties = SIX;
    if (counties.length > 8) counties = counties.slice(0, 8);
    const labels = [];
    for (let y = yearStart; y <= yearEnd; y++) labels.push(y);
    const datasets = counties.map(county => {
      const values = labels.map(y => {
        const row = DATA_ACTIVE.find(d => d.county === county && d.year === y);
        return row && getVal(row) != null ? getVal(row) : null;
      });
      resultTable.push({ county, series: labels.map((y,i)=>({year:y, value: values[i]})) });
      return { label: county, data: values };
    });
    let hasMissing = datasets.some(ds => ds.data.some(v => v === null));
    if (hasMissing) caveats.push('部分縣市在部分年份無資料（可能當年首長剛上任未滿一年，或該年調查未涵蓋），圖上會出現斷點。');
    chartData = { type: 'line', labels, datasets, metric };
  }

  else if (mode === 'ranking'){
    const y = yearEnd;
    let rows = DATA_ACTIVE.filter(d => d.year === y && (counties.length ? counties.includes(d.county) : true));
    rows = rows.filter(r => getVal(r) != null);
    rows.sort((a,b) => metric === 'rank' ? getVal(a) - getVal(b) : getVal(b) - getVal(a));
    const topN = Math.min(spec.topN || 10, 20);
    rows = rows.slice(0, topN);
    resultTable = rows.map(r => ({ county: r.county, year: y, value: getVal(r), mayor: r.mayor, party: r.party }));
    chartData = {
      type: 'bar', labels: rows.map(r => r.county),
      datasets: [{ label: `${y}年 ${METRIC_LABEL[metric]}`, data: rows.map(r => getVal(r)) }],
      metric
    };
    if (!rows.length) caveats.push(`找不到 ${y} 年符合條件的資料。`);
  }

  else if (mode === 'growth'){
    if (!counties.length) counties = COUNTIES;
    let deltas = [];
    counties.forEach(county => {
      const rowStart = DATA_ACTIVE.find(d => d.county === county && d.year === yearStart);
      const rowEnd = DATA_ACTIVE.find(d => d.county === county && d.year === yearEnd);
      if (rowStart && rowEnd && getVal(rowStart) != null && getVal(rowEnd) != null){
        let delta = getVal(rowEnd) - getVal(rowStart);
        if (metric === 'rank') delta = -delta; // lower rank number = improvement, flip so positive = better
        deltas.push({ county, startVal: getVal(rowStart), endVal: getVal(rowEnd), delta });
      }
    });
    deltas.sort((a,b) => b.delta - a.delta);
    const topN = Math.min(spec.topN || 10, 20);
    const top = deltas.slice(0, topN);
    resultTable = top;
    chartData = {
      type: 'bar', labels: top.map(d => d.county),
      datasets: [{ label: `${yearStart}→${yearEnd} ${METRIC_LABEL[metric]}變化`, data: top.map(d => Number(d.delta.toFixed(2))) }],
      metric
    };
    if (!deltas.length) caveats.push(`在 ${yearStart} 與 ${yearEnd} 兩個年份都有資料的縣市太少，無法比較進步幅度。`);
  }

  return { mode, metric, yearStart, yearEnd, counties, resultTable, chartData, caveats, chartType: spec.chartType };
}

function drawChart(canvasId, chartData){
  const ctx = document.getElementById(canvasId).getContext('2d');
  const isDark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() !== '#f7f5f2';
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  const textColor = isDark ? '#c9c9c0' : '#4a4a4a';
  const palette = ['#0f5c4c','#b8862f','#5b7fbf','#a3442f','#7a5ea8','#3d8f7a','#c26b3f','#4f7a3d'];

  const datasets = chartData.datasets.map((ds, i) => ({
    label: ds.label,
    data: ds.data,
    borderColor: palette[i % palette.length],
    backgroundColor: chartData.type === 'bar' ? palette[i % palette.length] : palette[i % palette.length] + '33',
    tension: 0.25,
    spanGaps: true,
    borderWidth: 2,
    pointRadius: chartData.type === 'line' ? 3 : 0,
  }));

  new Chart(ctx, {
    type: chartData.type,
    data: { labels: chartData.labels, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { display: datasets.length > 1 || chartData.type === 'bar', labels: { color: textColor, font: { size: 11.5 } } },
        tooltip: { mode: 'index', intersect: false }
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 11 } } },
        y: {
          grid: { color: gridColor }, ticks: { color: textColor, font: { size: 11 } },
          reverse: chartData.metric === 'rank',
          title: { display: true, text: METRIC_LABEL[chartData.metric], color: textColor, font: { size: 11 } }
        }
      }
    }
  });
}

function buildTableSummary(q){
  if (q.mode === 'trend'){
    return q.resultTable.map(r => {
      const pts = r.series.filter(p => p.value != null);
      if (!pts.length) return `${r.county}: 無資料`;
      const first = pts[0], last = pts[pts.length-1];
      return `${r.county}: ${first.year}年=${first.value} → ${last.year}年=${last.value}`;
    }).join('\n');
  }
  if (q.mode === 'ranking'){
    return q.resultTable.map((r,i) => `${i+1}. ${r.county}（${r.mayor}／${r.party}）: ${r.value}`).join('\n');
  }
  if (q.mode === 'growth'){
    return q.resultTable.map((r,i) => `${i+1}. ${r.county}: ${q.yearStart}年=${r.startVal} → ${q.yearEnd}年=${r.endVal}（變化 ${r.delta > 0 ? '+' : ''}${r.delta.toFixed(2)}）`).join('\n');
  }
  return '';
}

async function callBackend(prompt, wantJson){
  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, json: wantJson })
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok){
    const msg = body.error || ('伺服器錯誤（' + res.status + '）');
    throw new Error(body.detail ? (msg + '\n[技術細節] ' + body.detail) : msg);
  }
  return body;
}

async function sendQuery(){
  const question = qEl.value.trim();
  if (!question) return;
  qEl.value = '';
  sendBtn.disabled = true;
  addUserMsg(question);
  const thinkingEl = addAiThinking();

  try {
    const schemaPrompt = `你是一個資料查詢規劃器。使用者會用中文問關於台灣縣市首長施政滿意度的問題。
可用縣市（22個，已將升格前後合併為同一行政區）：${COUNTIES.join('、')}
「六都」＝ ${SIX.join('、')}
年份範圍：${YEAR_MIN} 到 ${YEAR_MAX}（資料庫最新的年份是 ${YEAR_MAX}，請把 ${YEAR_MAX} 當作「今年」「現在」「最新」來理解）
時間範圍換算規則（請務必按這個算，不要自己猜）：
- 「這十年」「近十年」「過去十年」→ yearStart = ${YEAR_MAX - 9}, yearEnd = ${YEAR_MAX}
- 「這五年」「近五年」「過去五年」→ yearStart = ${YEAR_MAX - 4}, yearEnd = ${YEAR_MAX}
- 「這N年」「近N年」→ yearStart = ${YEAR_MAX} - (N-1), yearEnd = ${YEAR_MAX}
- 「最新」「目前」「現在」單一年份 → yearStart = yearEnd = ${YEAR_MAX}
- 使用者有明確指定年份或區間時，以使用者說的為準，不要套用上面的規則
可用指標：total(施政總分,越高越好), poll(民調分數,越高越好), expert(專家評分,越高越好), rank(總排名,數字越小越好)
可用政黨：${PARTIES.join('、')}
可用模式：
- trend：某幾個縣市在一段期間的趨勢線
- ranking：某一年（用 yearEnd 表示）的排名比較
- growth：某段期間開始年(yearStart)到結束年(yearEnd)的進步/退步幅度比較

請針對使用者的問題，只回傳一個 JSON物件，不要有其他文字，格式：
{
  "mode": "trend" | "ranking" | "growth",
  "counties": ["縣市名",...] 或 ["SIX"] 或 ["ALL"] 或 [] (growth/ranking若沒指定特定縣市可留空陣列代表全部),
  "yearStart": 數字,
  "yearEnd": 數字,
  "metric": "total" | "poll" | "expert" | "rank",
  "party": ["政黨名",...] 或 [] (只有使用者明確提到政黨/黨籍時才填，否則留空陣列),
  "topN": 數字 (僅ranking/growth需要，預設10),
  "interpretation": "一句話重述你理解的問題（繁體中文）"
}
縣市名稱必須完全match上面列出的22個名稱之一，不要用舊名（如台北縣、台中縣），若使用者提到舊縣市名請自動轉換成合併後的新名稱。
政黨名稱必須完全match上面列出的政黨之一。
使用者問題：「${question}」`;

    let spec;
    try {
      const r = await callBackend(schemaPrompt, true);
      spec = r.json;
    } catch (e){
      renderAiResult(thinkingEl, { error: '查詢規劃失敗：' + e.message });
      sendBtn.disabled = false;
      return;
    }

    const q = runQuery(spec);

    if (!q.chartData || !q.chartData.datasets.length || q.chartData.datasets.every(ds => ds.data.every(v => v == null))){
      renderAiResult(thinkingEl, { error: `找不到符合「${spec.interpretation || question}」的資料，可以換個縣市名稱或年份區間再試試看。` });
      sendBtn.disabled = false;
      return;
    }

    const tableSummary = buildTableSummary(q);
    const commentPrompt = `使用者問：「${question}」
以下是根據真實資料庫計算出的結果（單位為分數或名次），請只根據這些數字，用3到4句繁體中文做簡短洞察摘要，語氣自然口語、給不熟悉這個主題的人看：
${tableSummary}

${q.caveats.length ? '另外，系統偵測到以下資料口徑注意事項，如果跟這個問題相關，請在摘要最後自然帶一句提醒（不用逐條念）：\n' + q.caveats.join('\n') : ''}

不要捏造任何未列出的數字，不要輸出JSON，只要輸出摘要文字本身。`;

    let commentaryText = '';
    try {
      const r = await callBackend(commentPrompt, false);
      commentaryText = (r.text || '').trim();
    } catch (e){
      commentaryText = q.interpretation || spec.interpretation || '以下是查詢結果：';
    }

    renderAiResult(thinkingEl, {
      commentaryText,
      chartSpec: q.chartData,
      caveats: q.caveats
    });

  } catch (err){
    renderAiResult(thinkingEl, { error: '發生錯誤，請再試一次：' + (err && err.message ? err.message : String(err)) });
  }
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', sendQuery);
qEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendQuery();
  }
});

</script>
